<!doctype html>
<html><head><meta charset="UTF-8"><title>FTC MT5 Trader</title><link rel="stylesheet" href="popup.css"></head>
<body><main class="app">
<header><div><h1>FTC Trader</h1><small id="connection">DISCONNECTED</small></div><select id="symbol"><option>XAUUSD</option><option>EURUSD</option><option>GBPUSD</option><option>USDJPY</option><option>NAS100</option></select></header>
<section class="account"><div><small>Balance</small><b id="balance">-</b></div><div><small>Equity</small><b id="equity">-</b></div><div><small>Floating</small><b id="profit">-</b></div></section>
<section class="quote"><span>Bid <b id="bid">-</b></span><span>Ask <b id="ask">-</b></span></section>
<section class="order"><div class="side"><button id="buy" class="buy">BUY</button><button id="sell" class="sell">SELL</button></div>
<label>Order Type<select id="orderType"><option value="market">Market</option><option value="limit">Limit</option></select></label>
<label>Entry<input id="entry" type="number" step="any"></label><label>SL<input id="sl" type="number" step="any"></label><label>TP<input id="tp" type="number" step="any"></label>
<label>Size Mode<select id="sizeMode"><option value="risk">Auto Risk %</option><option value="manual">Manual Lot</option></select></label>
<label id="riskBox">Risk %<input id="risk" type="number" value="0.5" min="0.01" step="0.1"></label>
<label id="lotBox" hidden>Lot<input id="lot" type="number" value="0.01" min="0" step="any"></label>
<div class="preview"><div><small>Lot</small><b id="previewLot">-</b></div><div><small>Risk</small><b id="previewRisk">-</b></div><div><small>R:R</small><b id="previewRR">-</b></div></div>
<button id="execute" class="execute">EXECUTE</button></section>
<section><h2>Open Positions</h2><div id="positions"></div></section>
<section><h2>Pending Orders</h2><div id="orders"></div></section>
</main><script src="popup.js"></script></body></html>
